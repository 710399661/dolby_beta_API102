name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 确保 Android SDK 工具可用（默认已存在，但为了保险可显式设置）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 安装所需的 SDK 平台（如果 compileSdk 为 37）
      - name: Install Android SDK Platform 37
        run: |
          yes | sdkmanager --install "platforms;android-37" || echo "Platform 37 not found, falling back to 33"
          # 备用：若 37 不存在，安装 33 确保构建继续（但可能不匹配）
          # sdkmanager --install "platforms;android-33"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Sync latest Unblocked Music source code
        run: |
          set -e
          git clone --depth=1 https://github.com/luoxingran/server.git || { echo "Clone failed"; exit 1; }
          cd server
          zip -r ../UnblockNeteaseMusic.zip .
          cd ..
          mkdir -p app/src/main/assets
          mv -f UnblockNeteaseMusic.zip app/src/main/assets/
          rm -rf server

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Release)
        # 如果未配置签名，可能仍需改为 assembleDebug
        run: ./gradlew app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
