name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4   # 可考虑升级到 v5（如有）

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Sync latest Unblocked Music source code
        run: |
          set -e
          git clone --depth=1 https://github.com/luoxingran/server.git || { echo "Clone failed"; exit 1; }
          cd server
          zip -r ../UnblockNeteaseMusic.zip .
          cd ..
          mkdir -p app/src/main/assets
          mv -f UnblockNeteaseMusic.zip app/src/main/assets/
          rm -rf server

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Release)
        # 如果未配置签名，此行会失败；可临时改为 assembleDebug
        run: ./gradlew app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
