[versions]
agp = "8.9.2"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
appcompat = "1.8.1"
gson = "2.11.0"
guava = "33.4.0-android"
dexlib2 = "2.5.2"
annimon-stream = "1.2.2"
localbroadcastmanager = "1.1.0"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
dexlib2 = { module = "org.smali:dexlib2", version.ref = "dexlib2" }
annimon-stream = { module = "com.annimon:stream", version.ref = "annimon-stream" }
localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
